<div class="bg-white p-6 lg:p-8 rounded-3xl shadow-card border border-slate-100 space-y-6 animate-fade-in"
     x-data="{ revealedHints: 0 }">

  <!-- Header & Chapter info -->
  <div class="flex items-center justify-between border-b border-slate-100 pb-4">
    <div class="flex items-center gap-2">
      <span class="px-3 py-1 rounded-full bg-brand-50 text-brand font-bold text-xs">
        {{ exercise.chapter }}
      </span>
      <span class="px-2.5 py-1 rounded-full bg-slate-100 text-slate-700 font-semibold text-xs">
        {{ exercise.difficulty }}
      </span>
    </div>

    <button type="button" @click="resetToStep1()" class="text-xs font-semibold text-slate-500 hover:text-slate-800 flex items-center gap-1">
      <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
      <span>Change Chapter</span>
    </button>
  </div>

  <!-- Exercise Statement with KaTeX -->
  <div class="space-y-3">
    <h3 class="text-sm font-bold uppercase tracking-wider text-slate-400">Problem Statement</h3>
    <div class="p-5 rounded-2xl bg-slate-50 border border-slate-200/70 text-slate-900 text-sm leading-relaxed whitespace-pre-line font-sans">
      {{ exercise.question }}
    </div>
  </div>

  <!-- HINTS ACCORDION (Revealed one at a time) -->
  {% if hints %}
  <div class="space-y-2.5">
    <div class="flex items-center justify-between">
      <span class="text-xs font-bold uppercase tracking-wider text-slate-700 flex items-center gap-1.5">
        <i data-lucide="help-circle" class="w-4 h-4 text-amber-500"></i>
        <span>Step-by-step Hints</span>
      </span>
      <button type="button"
              x-show="revealedHints < {{ hints|length }}"
              @click="revealedHints++"
              class="px-3 py-1 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-800 text-xs font-bold transition-colors">
        💡 Reveal Next Hint (<span x-text="revealedHints"></span>/{{ hints|length }})
      </button>
    </div>

    <div class="space-y-2">
      {% for hint in hints %}
      <div x-show="revealedHints >= {{ forloop.counter }}" x-cloak class="p-3.5 rounded-xl bg-amber-50/70 border border-amber-200 text-xs text-amber-950 font-medium leading-relaxed">
        <span class="font-bold text-amber-800">Hint {{ forloop.counter }}:</span> {{ hint }}
      </div>
      {% endfor %}
    </div>
  </div>
  {% endif %}

  <!-- STUDENT ANSWER FORM -->
  <form hx-post="{% url 'practice_check' exercise.id %}"
        hx-target="#practice-exercise-container"
        hx-swap="innerHTML"
        hx-indicator="#checking-spinner"
        class="space-y-4 pt-2 border-t border-slate-100">
    {% csrf_token %}

    <div>
      <label for="id_answer_text" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
        Your Working Steps & Final Answer
      </label>
      <textarea id="id_answer_text"
                name="answer_text"
                rows="4"
                required
                placeholder="Type your mathematical reasoning, formulas used, and final result..."
                class="w-full px-4 py-3 rounded-2xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand font-mono bg-slate-50/50"></textarea>
    </div>

    <div>
      <button type="submit"
              class="w-full py-4 px-6 rounded-2xl bg-brand text-white font-bold text-base hover:bg-brand-800 transition-all shadow-md shadow-brand/20 flex items-center justify-center gap-2">
        <i data-lucide="check-circle" class="w-5 h-5 text-emerald-400"></i>
        <span>Check My Answer & Grade</span>
      </button>
    </div>

    <!-- Checking Spinner -->
    <div id="checking-spinner" class="htmx-indicator w-full py-4 text-center space-y-1">
      <div class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-brand/10 text-brand animate-spin">
        <i data-lucide="loader-2" class="w-5 h-5"></i>
      </div>
      <p class="text-xs font-semibold text-slate-600">Evaluating your answer against Bac criteria...</p>
    </div>
  </form>

</div>

<script>
  if (window.renderMathInElement) {
    renderMathInElement(document.getElementById('practice-exercise-container'), {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false}
      ],
      throwOnError: false
    });
  }
  if (window.lucide) { lucide.createIcons(); }
</script>
